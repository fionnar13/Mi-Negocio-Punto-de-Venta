<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>سازمان فروشگاه</title>
  <meta name="description" content="نسخهٔ وب (PWA) سامانهٔ فروشگاهی «سازمان فروشگاه» — فروش، خرید، کالاها و گزارش‌ها؛ کاملاً آفلاین.">
  <meta name="theme-color" content="#1976D2">
  <meta name="color-scheme" content="light">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="64x64" href="./icons/icon-64.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="POS">

  <!-- فونت محلی (بدون CDN) -->
  <link rel="preload" href="./fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/Vazirmatn-Medium.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="./styles.css">
</head>
<body>

  <!-- نوار برنامه -->
  <header class="app-bar">
    <div class="app-bar-lead">
      <svg class="app-bar-logo" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 4H4v2h16V4zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1zm-9 4H6v-4h6v4z"/>
      </svg>
      <div class="app-bar-titles">
        <span class="app-bar-title" id="app-title">سازمان فروشگاه</span>
        <span class="app-bar-date" id="app-date">—</span>
      </div>
    </div>
    <div class="app-bar-actions">
      <button class="icon-btn" id="install-btn" hidden title="نصب برنامه" aria-label="نصب برنامه">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      </button>
      <a class="icon-btn" href="#/settings" title="تنظیمات" aria-label="تنظیمات">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </a>
    </div>
  </header>

  <!-- نمای فعال -->
  <main id="view" class="view" aria-live="polite"></main>

  <!-- نوار پایین -->
  <nav class="bottom-nav" id="bottom-nav" aria-label="ناوبری اصلی">
    <a class="nav-item" href="#/dashboard" data-route="dashboard">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>
      <span>داشبورد</span>
    </a>
    <a class="nav-item" href="#/sale" data-route="sale">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 17H6v2h12v-2zm0-4H6v2h12v-2zm0-4H6v2h12V9zm1-6H5c-1.11 0-2 .9-2 2v16l3-2 2 2 2-2 2 2 2-2 2 2 2-2 3 2V5c0-1.1-.9-2-2-2z"/></svg>
      <span>فروش</span>
    </a>
    <a class="nav-item" href="#/purchase" data-route="purchase">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45C4.52 15.37 5.48 17 7 17h12v-2H7l1.1-2h7.45c.75 0 1.41-.41 1.75-1.03L21.7 4H5.21l-.94-2H1zm16 16c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
      <span>خرید</span>
    </a>
    <a class="nav-item" href="#/products" data-route="products">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 2 7v10l10 5 10-5V7L12 2zm0 2.3L18.5 8 12 11.2 5.5 8 12 4.3zM4 9.2l7 3.5v6.8l-7-3.5V9.2zm8 10.3v-6.8l7-3.5v6.8l-7 3.5z"/></svg>
      <span>کالاها</span>
    </a>
    <a class="nav-item" href="#/reports" data-route="reports">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-5.58 5.85-4-4L2 16.99z"/></svg>
      <span>گزارش‌ها</span>
    </a>
  </nav>

  <!-- دکمهٔ شناور (در نمای کالاها نمایش داده می‌شود) -->
  <button class="fab" id="fab" data-action="new-product" hidden title="کالای جدید" aria-label="کالای جدید">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
  </button>

  <!-- اسکنر بارکد (تمام‌صفحه) -->
  <div class="scanner-modal" id="scanner-modal" hidden>
    <div class="scanner-head">
      <button class="icon-btn light" data-action="close-scanner" title="بستن" aria-label="بستن">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
      <span class="scanner-title" id="scanner-title">اسکن بارکد</span>
      <button class="icon-btn light" id="torch-btn" data-action="torch" hidden title="چراغ‌قوه" aria-label="چراغ‌قوه">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h12v3l-4 4v11a2 2 0 0 1-4 0V9L6 5V2zm5 3h2v2h-2V5z"/></svg>
      </button>
    </div>
    <div class="scanner-stage">
      <video id="scanner-video" playsinline muted></video>
      <div class="scan-frame" aria-hidden="true"></div>
    </div>
    <div class="scanner-foot">
      <div class="scanner-status" id="scanner-status">در حال راه‌اندازی دوربین…</div>
      <form class="scan-manual" id="scan-manual-form">
        <input class="input" id="scan-manual-input" type="text" inputmode="numeric" autocomplete="off" placeholder="ورود دستی بارکد…">
        <button class="btn btn-primary" type="submit">تأیید</button>
      </form>
    </div>
  </div>

  <!-- ریشهٔ دیالوگ‌ها -->
  <div id="dialog-root"></div>

  <!-- ریشهٔ اعلان‌ها -->
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script src="./register-sw.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>آفلاین — سازمان فروشگاه</title>
  <meta name="theme-color" content="#1976D2">
  <style>
    /* استایل درون‌خطی مستقل — این صفحه حتی بدون کش فونت هم باید کار کند */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Vazirmatn, "Segoe UI", Tahoma, sans-serif;
      background: #f4f7fb;
      color: #1a1c1e;
      text-align: center;
      padding: 24px;
    }
    .box {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 6px 24px rgba(16, 42, 82, .1);
      padding: 36px 28px;
      max-width: 360px;
      width: 100%;
    }
    .icon { width: 64px; height: 64px; margin: 0 auto 14px; }
    h1 { font-size: 1.15rem; margin: 0 0 8px; }
    p { font-size: .85rem; color: #5c6470; margin: 0 0 22px; line-height: 1.9; }
    button {
      font-family: inherit;
      font-size: .9rem;
      font-weight: 600;
      background: #1976D2;
      color: #fff;
      border: 0;
      border-radius: 999px;
      padding: 12px 32px;
      cursor: pointer;
    }
    button:active { background: #135ba3; }
    .hint { font-size: .72rem; color: #8a93a3; margin-top: 18px; }
  </style>
</head>
<body>
  <div class="box">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#1976D2" stroke-width="1.4" aria-hidden="true">
      <path d="M2 12h4l2 5 4-10 2 5h4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="2" y1="3" x2="6" y2="3" stroke-linecap="round"/>
      <line x1="18" y1="3" x2="22" y2="3" stroke-linecap="round"/>
      <line x1="2" y1="21" x2="6" y2="21" stroke-linecap="round"/>
      <line x1="18" y1="21" x2="22" y2="21" stroke-linecap="round"/>
    </svg>
    <h1>اتصال اینترنت قطع است</h1>
    <p>این صفحه در حافظهٔ آفلاین ذخیره نشده است.<br>برای بازگشت به برنامه، دوباره تلاش کنید.</p>
    <button onclick="location.replace('./index.html')">تلاش دوباره</button>
    <div class="hint">اگر قبلاً برنامه را باز کرده باشید، نسخهٔ آفلاین از کش مرورگر اجرا می‌شود.</div>
  </div>
</body>
</html>
